name: Release

on:
  # PR-based releases: main is branch-protected. Bump `package.json` version via PR, then run this workflow to tag/publish.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match package.json)"
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: npm ci
      - run: npm run lint
      - name: Release (use version from package.json)
        run: |
          VERSION_INPUT="${{ inputs.version }}"
          VERSION_PKG=$(node -p 'require("./package.json").version')
          if [ -n "$VERSION_INPUT" ] && [ "$VERSION_INPUT" != "$VERSION_PKG" ]; then
            echo "Input version $VERSION_INPUT does not match package.json ($VERSION_PKG)"
            exit 1
          fi
          VERSION=${VERSION_INPUT:-$VERSION_PKG}
          npm run release:ci -- --increment "$VERSION"
        env:
          DEBUG: release-it:config
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          NODE_DEBUG: release-it:config
