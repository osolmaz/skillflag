name: Rust Release

on:
  push:
    tags:
      - "rust/v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "$TAG" | grep -Eq '^rust/v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag $TAG does not match rust/vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tagged commit is not on main"; exit 1; }
          VERSION=$(awk -F '"' '/^version = /{print $2; exit}' rust/Cargo.toml)
          [ "rust/v$VERSION" = "$TAG" ] || { echo "Tag $TAG does not match workspace version $VERSION"; exit 1; }
      - name: Gate
        working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test
      - name: Publish to crates.io
        working-directory: rust
        run: cargo publish -p skillflag-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
