version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - cyclop
    - errcheck
    - errorlint
    - exhaustive
    - gocognit
    - gosec
    - ineffassign
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    cyclop:
      max-complexity: 12
    exhaustive:
      default-signifies-exhaustive: true
    gocognit:
      min-complexity: 20
    staticcheck:
      # ST1005 (error string capitalization/punctuation) is disabled by
      # contract: error messages are user-facing CLI output that must match
      # the TypeScript reference implementation byte-for-byte
      # (docs/SKILLFLAG_SPEC.md conformance).
      checks: ["all", "-ST1005"]
    gosec:
      excludes:
        # G304: this tool is a skill exporter/installer; reading files at
        # user-supplied paths is its purpose. Tar entry names are validated
        # against traversal/absolute paths before any filesystem access.
        - G304
        # G301/G302/G306: permissions are deliberate. The installer mirrors
        # the reference implementation: extraction writes with default
        # (umask-mediated) 0666/0777 modes, and directory copies preserve
        # the source tree's modes including execute bits.
        - G301
        - G302
        - G306
    revive:
      severity: error
      rules:
        - name: file-length-limit
          arguments:
            - max: 800
              skip-comments: true
              skip-blank-lines: true
          exclude:
            - "**/*_test.go"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
