[project]
name = "skillflag-py"
version = "0.1.0"
description = "Skillflag producer CLI and skill-install companion (Python port)"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Onur Solmaz" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/osolmaz/skillflag"
Repository = "https://github.com/osolmaz/skillflag"

[project.scripts]
skillflag-py = "skillflag.cli:main"
skill-install-py = "skillflag.install.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillflag"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
